apiVersion: apps/v1
kind: Deployment
metadata: { name: adversa, labels: { app: adversa } }
spec:
  replicas: 1
  selector: { matchLabels: { app: adversa } }
  template:
    metadata: { labels: { app: adversa } }
    spec:
      containers:
        - name: adversa
          image: ghcr.io/cognis-digital/adversa:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: adversa }
spec:
  selector: { app: adversa }
  ports: [{ port: 80, targetPort: 8000 }]
